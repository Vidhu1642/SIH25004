<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cattle & Buffalo Breed Classifier</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body.classifier-page {
      background: url("/static/background.jpg") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      padding-top: 80px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
    }
    .app-container {
      flex-grow: 1;
    }

    /* Navbar logo */
    .navbar-brand img {
      height: 50px;
      width: 50px;
      margin-right: 10px;
    }

    /* Main card container */
    .app-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 25px;
      max-width: 600px;
      margin: 50px auto;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      text-align: center;
    }

    h2 {
      font-weight: bold;
      color: #28a745;
      margin-bottom: 30px;
    }

    /* Upload box */
    .upload-box {
      border: 2px dashed #28a745;
      border-radius: 20px;
      padding: 40px 20px;
      background: #f9fff6;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.1rem;
    }

    .upload-box:hover {
      background: #eefdea;
      transform: scale(1.02);
    }

    .upload-box .browse {
      color: #28a745;
      font-weight: bold;
      text-decoration: underline;
      cursor: pointer;
    }

    .upload-box input {
      display: none;
    }

    /* Preview image */
    .preview {
      margin-top: 25px;
    }

    .preview img {
      max-width: 100%;
      max-height: 350px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: block;
      margin: auto;
    }

    /* Predict button */
    #predictBtn {
      margin-top: 30px;
      padding: 12px 40px;
      font-size: 1.2rem;
      border-radius: 12px;
      transition: 0.3s;
    }

    #predictBtn:hover {
      transform: scale(1.05);
    }

    /* Result box */
    .result {
      margin-top: 30px;
      padding: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 15px;
      background: #f3fdf4;
      color: #222;
      border-left: 6px solid #28a745;
      transition: all 0.3s ease;
    }

    @media (max-width: 576px) {
      .app-container {
        padding: 30px 20px;
        margin: 20px;
      }

      .preview img {
        max-height: 250px;
      }

      #predictBtn {
        width: 100%;
      }
    }
  </style>
</head>
<body class="classifier-page">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-success fixed-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="../static/BreedRecognizer1.png" alt="Cattle & Buffalo Classifier Logo">
        <span>Cattle & Buffalo Breed Recognizer</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="classifier.html">Classifier</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="dataset.html">Dataset</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main App Container -->
  <div class="app-container">

    <!-- Title -->
    <h2>Cattle & Buffalo Breed Classifier 🐂🐃</h2>

    <!-- Upload Section -->
    <div class="upload-box" id="uploadBox">
      <p>Drag & Drop an image here or <span class="browse">Browse</span></p>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- Preview -->
    <div class="preview" id="preview">
      <img id="previewImage" src="#" alt="Preview" style="display:none;">
    </div>
    <!-- Predict Button -->
    <div class="d-flex justify-content-center">
      <button id="predictBtn" class="btn btn-success btn-lg" disabled>Predict</button>
    </div>

    <!-- Result -->
    <div class="result" id="result">
      Prediction will appear here...
    </div>
  </div>

  <!-- Scripts -->
  <script src="/static/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
 <footer class="bg-success text-white py-3 mt-5">
  <div class="container d-flex justify-content-center">
    &copy; 2025 SIH25005 - Cattle & Buffalo Breed Recognizer. All Rights Reserved.
  </div>
</footer>

</body>
</html>
